namespaceOverride: quasar-tracing

global:
  imagePullPolicy: IfNotPresent

registry:
  host: registry.example.com
  project: quasar-tracing
  tag: "1.0.7"

clickhouse:
  credentials:
    user: quasar_tracing
    password: "change-me"
  image:
    repository: clickhouse/clickhouse-server
    tag: "26.3"
  storage:
    size: 50Gi
    hostPath: /var/lib/quasar-tracing/clickhouse
    reclaimPolicy: Retain
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

kafka:
  image:
    repository: apache/kafka
    tag: "4.2.1"
  storage:
    size: 10Gi
    hostPath: /var/lib/quasar-tracing/kafka
    reclaimPolicy: Retain
  heapOpts: "-Xmx512M -Xms512M"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  topics:
    partitions: 3
    replicationFactor: 1

otelCollector:
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.153.0"
  serviceAccount:
    create: true
    name: otel-collector
  k8sAttributes:
    enabled: true
  service:
    type: NodePort
    grpcNodePort: 30317
    httpNodePort: 30318
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

otelExporter:
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.153.0"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

controlPanelServer:
  image:
    repository: registry.example.com/quasar-tracing/control-panel-server
    tag: "1.0.7"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

controlPanel:
  image:
    repository: registry.example.com/quasar-tracing/control-panel
    tag: "1.0.7"
  imagePullPolicy: Always
  service:
    type: NodePort
    nodePort: 30083
  ingress:
    enabled: true
    className: nginx
    host: tracing.example.com
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

instrumentation:
  targetNamespace: application-namespace
  resourceAttributes:
    serviceNamespace: example
    environmentName: production
    serviceVersion: "1.0.7"
    extra: {}
  serviceNameEnv: OTEL_SERVICE_NAME
  grpcEndpoint: http://otel-collector.quasar-tracing.svc.cluster.local:4317
  httpEndpoint: http://otel-collector.quasar-tracing.svc.cluster.local:4318
  nodeGrpcEndpoint: http://collector.example.com:30317
  nodeHttpEndpoint: http://collector.example.com:30318
