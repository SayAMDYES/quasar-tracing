apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ include "quasar-tracing.namespace" . }}
  labels:
    {{- include "quasar-tracing.componentLabels" (dict "root" . "component" "otel-collector") | nindent 4 }}
spec:
  type: {{ .Values.otelCollector.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      {{- if eq .Values.otelCollector.service.type "NodePort" }}
      nodePort: {{ .Values.otelCollector.service.grpcNodePort }}
      {{- end }}
    - name: otlp-http
      port: 4318
      targetPort: 4318
      {{- if eq .Values.otelCollector.service.type "NodePort" }}
      nodePort: {{ .Values.otelCollector.service.httpNodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: {{ include "quasar-tracing.namespace" . }}
  labels:
    {{- include "quasar-tracing.componentLabels" (dict "root" . "component" "otel-collector") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: otel-collector
    spec:
      {{- if .Values.otelCollector.k8sAttributes.enabled }}
      serviceAccountName: {{ .Values.otelCollector.serviceAccount.name }}
      {{- end }}
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z kafka 9092; do echo "waiting for kafka"; sleep 3; done
      containers:
        - name: otel-collector
          image: {{ .Values.otelCollector.image.repository }}:{{ .Values.otelCollector.image.tag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: otel-collector-config.yaml
          readinessProbe:
            tcpSocket:
              port: 4317
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4317
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.otelCollector.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-exporter
  namespace: {{ include "quasar-tracing.namespace" . }}
  labels:
    {{- include "quasar-tracing.componentLabels" (dict "root" . "component" "otel-exporter") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: otel-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: otel-exporter
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka 9092; do echo "waiting for kafka"; sleep 3; done
              until nc -z clickhouse 9000; do echo "waiting for clickhouse"; sleep 3; done
      containers:
        - name: otel-exporter
          image: {{ .Values.otelExporter.image.repository }}:{{ .Values.otelExporter.image.tag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          envFrom:
            - secretRef:
                name: quasar-tracing-credentials
          ports:
            - name: health
              containerPort: 13133
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: otel-exporter-config.yaml
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.otelExporter.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: otel-exporter-config
