services:
  kafka:
    image: apache/kafka:4.2.1
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - ./data/kafka/data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 10s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: "quasar-dev-password"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_LISTEN_HOST: 0.0.0.0
      CLICKHOUSE_LOG_LEVEL: warning
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user admin --password quasar-dev-password --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./config/otel-collector/config.yml:/etc/otelcol-contrib/config.yaml:ro

  otel-exporter:
    image: otel/opentelemetry-collector-contrib:0.153.0
    depends_on:
      clickhouse:
        condition: service_started
      kafka:
        condition: service_healthy
    volumes:
      - ./config/otel-exporter/config.yml:/etc/otelcol-contrib/config.yaml:ro

  # Platform read API — reads ClickHouse over the shared network and serves /api.
  platform:
    build:
      context: ../../platform
    image: quasar-tracing-platform:local
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:clickhouse://clickhouse:8123/quasar_tracing?connect_timeout=10000&socket_timeout=60000
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: "quasar-dev-password"
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Control panel — nginx serves the built UI and proxies /api to the platform service.
  control-panel:
    build:
      context: ../../control-panel
    image: quasar-tracing-control-panel:local
    depends_on:
      - platform
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  clickhouse-data:
