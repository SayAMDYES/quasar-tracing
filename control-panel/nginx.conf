# Serves the built control panel and proxies /api to the platform backend.
# Replaces the Vite dev proxy (vite.config.js) for the containerized deployment.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — unknown paths fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API calls go to the platform service on the shared network. Resolving through
    # Docker's embedded DNS at request time keeps nginx healthy even if the backend
    # starts later or restarts with a new address.
    location /api/logs/stream {
        resolver 127.0.0.11 valid=10s;
        set $platform_upstream http://platform:8080;
        proxy_pass $platform_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $platform_upstream http://platform:8080;
        proxy_pass $platform_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
